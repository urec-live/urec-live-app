// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // Version pinned to match Expo's kotlin version so that org.jetbrains.kotlin.plugin.compose
    // (bundled in kotlin-gradle-plugin 2.0+) is available to the :wear module.
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20')
    classpath('org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
